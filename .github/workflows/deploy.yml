name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
    
    - name: Add server to known hosts
      run: |
        ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
    
    - name: Deploy to production
      run: |
        ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
          set -e
          cd ${{ secrets.DEPLOY_PATH }}
          export PROJECT_DIR="${{ secrets.DEPLOY_PATH }}"
          export BACKUP_BEFORE_DEPLOY=true
          bash scripts/deploy.sh
        EOF
    
    - name: Health check
      run: |
        sleep 10
        curl -f ${{ secrets.WEB_PANEL_URL }}/health || exit 1
    
    - name: Notify deployment
      if: success()
      run: |
        echo "Deployment successful"
        # Add notification logic here (Slack, Discord, etc.)

  docker-deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to Docker Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ secrets.DOCKER_REGISTRY }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_REGISTRY }}/swiftdevbot:latest
          ${{ secrets.DOCKER_REGISTRY }}/swiftdevbot:${{ github.sha }}
        cache-from: type=registry,ref=${{ secrets.DOCKER_REGISTRY }}/swiftdevbot:buildcache
        cache-to: type=registry,ref=${{ secrets.DOCKER_REGISTRY }}/swiftdevbot:buildcache,mode=max
    
    - name: Deploy to server
      run: |
        ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
          docker pull ${{ secrets.DOCKER_REGISTRY }}/swiftdevbot:latest
          docker compose down
          docker compose up -d
        EOF

